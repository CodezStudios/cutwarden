[project]
name = "cutwarden"
version = "0.5.0"
description = "Brand-safe video editing and motion graphics for AI agents, over MCP. No browser, no generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "pillow>=10", "numpy>=1.24", "pydantic>=2"]
[project.optional-dependencies]
transcribe = ["faster-whisper"]
[project.scripts]
cutwarden = "cutwarden.cli:main"
cutwarden-mcp = "cutwarden.server:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["cutwarden"]
